# Local infrastructure for the integrations: `docker compose up -d`
services:
  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # management UI (guest / guest)

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"     # SMTP
      - "8025:8025"     # web inbox
